name: Nightly jobs

# Render's free instance sleeps when idle, so the node-cron schedules in
# server.js rarely fire. This workflow wakes the service and calls the
# daily sweep and recurring generation endpoints once a night.
on:
  schedule:
    # GitHub cron is UTC. 05:17 UTC is 01:17 Toronto in summer (EDT) and
    # 00:17 in winter (EST), so it always runs after Toronto midnight.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-jobs
  cancel-in-progress: false

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://fintrack-backend-rzrh.onrender.com' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check CRON_SECRET is configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi

      - name: Wake the backend
        # A cold start on Render's free tier takes ~30-60s; retry until healthy.
        run: |
          curl -fsS --max-time 90 --retry 6 --retry-delay 15 --retry-all-errors \
            "$BACKEND_URL/api/health"

      - name: Daily sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/daily-check"

      - name: Generate recurring transactions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/trigger-recurring"

  backup:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download backup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set."
            exit 1
          fi
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/cron/backup" -o backup.json
          test "$(jq -r .format backup.json)" = "fintrack-backup"
          echo "Backup downloaded successfully. Accounts: $(jq '.accounts | length' backup.json), Transactions: $(jq '.transactions | length' backup.json)"

      - name: Encrypt
        env:
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::Repository variable BACKUP_AGE_RECIPIENT is not configured."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y age
          age -r "$AGE_RECIPIENT" -o backup.json.age backup.json
          shred -u backup.json
          echo "Backup encrypted with age successfully."

      - name: Commit to private backups repo
        env:
          TOKEN: ${{ secrets.BACKUPS_REPO_TOKEN }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$AGE_RECIPIENT" ]; then
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::Repository secret BACKUPS_REPO_TOKEN is not configured. Encrypted artifact will be retained via Actions artifact."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/Maverick2506/fintrack-backups.git" b
          mkdir -p b/backups && cp backup.json.age "b/backups/$(date -u +%F).json.age"
          cd b
          git add .
          git -c user.name="fintrack-bot" -c user.email="bot@users.noreply.github.com" commit -m "backup $(date -u +%F)" || echo "No changes to commit"
          git push

      - name: Upload encrypted backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: backup.json.age
          if-no-files-found: ignore
          retention-days: 90
