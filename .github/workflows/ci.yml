name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start API (local SQLite, never production)
        env:
          NODE_ENV: test
          ALLOW_DEV_BYPASS: "true"
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
      - run: npm test
      - if: failure()
        run: cat server.log
