name: Morning Digest

on:
  schedule:
    - cron: "37 12 * * *" # ≈ 08:37 Toronto (EDT) / 07:37 (EST)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Request Morning Digest and Publish to ntfy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BACKEND_URL: https://fintrack-backend-rzrh.onrender.com
        run: |
          code=$(curl -sS -o d.json -w '%{http_code}' --max-time 120 --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" "$BACKEND_URL/api/cron/digest")
          if [ "$code" = "204" ]; then
            echo "Nothing to report this morning (HTTP 204)."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Digest endpoint returned unexpected HTTP status code $code"
            cat d.json
            exit 1
          fi
          jq --arg t "$NTFY_TOPIC" '{
            topic: $t,
            title,
            message,
            priority: (if .priority == "high" then 4 else 3 end),
            tags: (.tags | split(","))
          }' d.json \
          | curl -fsS ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} -H "Content-Type: application/json" -d @- "https://ntfy.sh/"
          echo "Morning digest successfully delivered to ntfy topic."
